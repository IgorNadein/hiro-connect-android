// Opt-in native UI checks. No test runtime is added to the release APK.
gradle.afterProject { p ->
    if (p.path == ':app') {
        def source = new File(p.rootProject.projectDir, 'tools/ui-smoke')
        p.android.testOptions.unitTests.includeAndroidResources = true
        p.android.sourceSets.getByName('test').java.srcDir(source)
        p.android.sourceSets.getByName('test').kotlin.srcDir(source)
        p.dependencies.add('testImplementation', 'org.robolectric:robolectric:4.16.1')
        p.dependencies.add('testImplementation', 'androidx.test:core:1.7.0')
        p.dependencies.add('testImplementation', 'androidx.test.ext:junit:1.3.0')
        p.dependencies.add('testImplementation', 'androidx.compose.ui:ui-test-junit4-android:1.10.0')
        p.dependencies.add('debugImplementation', 'androidx.compose.ui:ui-test-manifest:1.10.0')
        p.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
            systemProperty 'hiro.smoke.output', new File(p.rootProject.buildDir, 'ui-smoke').absolutePath
            maxHeapSize = '3g'
        }
    }
}
