name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/ui-smoke/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'libbaresip-android'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool m4 pkg-config
          sudo ln -sf "$ANDROID_HOME/cmake/3.22.1/bin/cmake" /usr/bin/cmake
          sudo ln -sf "$ANDROID_HOME/cmake/3.22.1/bin/ninja" /usr/bin/ninja
      - name: Build patched baresip libraries
        run: |
          make -C libbaresip-android download-sources
          ./scripts/apply-native-build-patch.sh
          ./scripts/pin-native-dependencies.sh
          ./scripts/apply-audio-patch.sh
          make -C libbaresip-android libbaresip \
            ANDROID_TARGET_ARCH=arm64-v8a \
            NDK_PATH="$ANDROID_HOME/ndk/27.1.12297006" \
            OUTPUT_DIR="$GITHUB_WORKSPACE/distribution"
      - name: Compute release version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('app/build.gradle.kts').read_text()
          version_name = re.search(r'versionName = System\.getenv\("VERSION_NAME"\) \?: "([^"]+)"', source)
          version_code = re.search(r'versionCode = System\.getenv\("VERSION_CODE"\)\?\.toInt\(\) \?: (\d+)', source)
          if version_name is None or version_code is None:
              raise SystemExit('Unable to read base version from app/build.gradle.kts')
          base_name = version_name.group(1)
          base_code = int(version_code.group(1))
          run_number = int(os.environ['GITHUB_RUN_NUMBER'])
          release_name = f'{base_name}-{run_number}'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VERSION_NAME={release_name}\n')
              output.write(f'VERSION_CODE={base_code + run_number}\n')
              output.write(f'RELEASE_TAG=v{release_name}\n')
          PY
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hiro-connect-release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/hiro-connect-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - name: Verify native interface and priority screens
        run: |
          ./gradlew -I tools/ui-smoke/run-ui.init.gradle :app:testDebugUnitTest \
            --tests ru.hiro.manager.NativePrioritySmokeTest \
            --tests ru.hiro.manager.NativeWorkspaceSmokeTest \
            --tests ru.hiro.manager.NativeVisualSystemTest \
            --tests ru.hiro.manager.NativeCallDetailsTest \
            --tests ru.hiro.manager.NativeSharedCallsTest
      - name: Verify and prepare APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          SIGNER_DIGEST=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$SIGNER_DIGEST" = '0e22bda4393b0fe6a09c786ba6078aa98d25cd4646939b5c12189126b4bc5266'
          mkdir release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/HI-RO-Connect-${RELEASE_TAG}.apk"
          cd release-assets
          sha256sum "HI-RO-Connect-${RELEASE_TAG}.apk" > "HI-RO-Connect-${RELEASE_TAG}.apk.sha256"
      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HI-RO Connect ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            Общий журнал звонков организации вместо только локальной истории: поиск, пропущенные, загрузка следующих страниц и карточка звонка. История смартфона сохранена отдельно.
            Серверные записи доступны менеджерам и администраторам, журнал — всем авторизованным. Воспроизведение запускается только по кнопке; есть пауза и перемотка. Файл загружается с авторизацией во временный приватный кеш.
            Общая заметка команды защищена от перезаписи чужих изменений. Вкладки «Сейчас» и «Очередь» показывают актуальные данные АТС. Участие запрашивается через входящий вызов в собственное рабочее приложение; ответьте, чтобы вас слышали участники. Это не скрытое прослушивание.
            Информация «кто привёл клиента» удалена с экранов и из клиентской модели. Nullable-атрибуция сохраняется только на сервере.

            Требуется обновлённый HI-RO Server с включённым общим журналом. Старые WAV без журнала АТС показываются как архив с неизвестными номером и участниками. Исходящие без серверной записи остаются без аудио; автоматическая запись всех вызовов этим обновлением не включается. Резюме ИИ к общей истории пока не подключено.
            Автотесты интерфейса, прав, заметок и сервера пройдены. Голос и участие необходимо отдельно проверить на разрешённом тестовом звонке с физическими устройствами. Во время разработки реальные звонки не совершались, SMS не отправлялись и адресная книга не загружалась.

            Установка поверх официального приложения сохраняет данные и использует прежний ключ подписи. Обновления: Настройки → Помощь и проверка связи → О приложении.

            Version: ${{ env.VERSION_NAME }}
            Version code: ${{ env.VERSION_CODE }}
            Commit: ${{ github.sha }}
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hiro-connect-release.p12"
