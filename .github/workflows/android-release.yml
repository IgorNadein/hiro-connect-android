name: Android Release APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'libbaresip-android'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Compute release version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('app/build.gradle.kts').read_text()
          version_name = re.search(r'versionName = System\.getenv\("VERSION_NAME"\) \?: "([^"]+)"', source)
          version_code = re.search(r'versionCode = System\.getenv\("VERSION_CODE"\)\?\.toInt\(\) \?: (\d+)', source)
          if version_name is None or version_code is None:
              raise SystemExit('Unable to read base version from app/build.gradle.kts')
          base_name = version_name.group(1)
          base_code = int(version_code.group(1))
          run_number = int(os.environ['GITHUB_RUN_NUMBER'])
          release_name = f'{base_name}-{run_number}'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VERSION_NAME={release_name}\n')
              output.write(f'VERSION_CODE={base_code + run_number}\n')
              output.write(f'RELEASE_TAG=v{release_name}\n')
          PY
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hiro-connect-release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/hiro-connect-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
      - name: Verify and prepare APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          mkdir release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/HI-RO-Connect-${RELEASE_TAG}.apk"
          cd release-assets
          sha256sum "HI-RO-Connect-${RELEASE_TAG}.apk" > "HI-RO-Connect-${RELEASE_TAG}.apk.sha256"
      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HI-RO Connect ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            Stable Android release of HI-RO Connect.

            The APK can be installed from this page or through “About → Updates” in the application.

            Version: ${{ env.VERSION_NAME }}
            Version code: ${{ env.VERSION_CODE }}
            Commit: ${{ github.sha }}
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hiro-connect-release.p12"
